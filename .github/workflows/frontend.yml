name: Frontend
on:
  pull_request:
    paths:
      - "frontend/**"
jobs:
  Frontend-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
      - uses: actions/checkout@v5
      - run: "npm install"
        working-directory: ./frontend
      - run: "npm run test"
        working-directory: ./frontend
