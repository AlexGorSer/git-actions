name: Backend
on:
  pull_request:
    paths:
      - "backend/**"
jobs:
  Backend-Actions:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: ./backend  
    steps:
      - name: Check out repository code
      - uses: actions/checkout@v5
      - run: "npm install"
      - run: "npm run test"

